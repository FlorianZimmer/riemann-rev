<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d"><title id="t">The Galois row by quadratic descent (schematic)</title><desc id="d">Schematic: representations r_K over infinitely many quadratic CM extensions K = E(sqrt(-p)) are patched to one rho over E whose Frobenius polynomials match the Satake parameters of pi.</desc><defs><marker id="arr-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="345" y="262" width="210" height="56" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1.4" opacity="0.13" /><text xml:space="preserve" x="450" y="286" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600" opacity="1" >E  (CM field),  π on GL_a</text><text xml:space="preserve" x="450" y="306" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400" opacity="1" >one ρ : G_E → GL_a(Q̄_ℓ)</text><rect x="40" y="112" width="180" height="54" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1" opacity="0.07" /><text xml:space="preserve" x="130" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan >K</tspan><tspan baseline-shift="sub" font-size="9.36">1</tspan><tspan > = E(√−p</tspan><tspan baseline-shift="sub" font-size="9.36">1</tspan><tspan >)</tspan></text><text xml:space="preserve" x="130" y="156" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400"><tspan >r</tspan><tspan baseline-shift="sub" font-size="8.64">K1</tspan><tspan >  from the good case</tspan></text><line x1="130" y1="168" x2="399" y2="258" stroke="#c2410c" stroke-width="1.4" opacity="0.65" stroke-linecap="round" marker-end="url(#arr-g)"/><rect x="245" y="112" width="180" height="54" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1" opacity="0.07" /><text xml:space="preserve" x="335" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan >K</tspan><tspan baseline-shift="sub" font-size="9.36">2</tspan><tspan > = E(√−p</tspan><tspan baseline-shift="sub" font-size="9.36">2</tspan><tspan >)</tspan></text><text xml:space="preserve" x="335" y="156" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400"><tspan >r</tspan><tspan baseline-shift="sub" font-size="8.64">K2</tspan><tspan >  from the good case</tspan></text><line x1="335" y1="168" x2="433" y2="258" stroke="#c2410c" stroke-width="1.4" opacity="0.65" stroke-linecap="round" marker-end="url(#arr-g)"/><rect x="450" y="112" width="180" height="54" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1" opacity="0.07" /><text xml:space="preserve" x="540" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan >K</tspan><tspan baseline-shift="sub" font-size="9.36">3</tspan><tspan > = E(√−p</tspan><tspan baseline-shift="sub" font-size="9.36">3</tspan><tspan >)</tspan></text><text xml:space="preserve" x="540" y="156" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400"><tspan >r</tspan><tspan baseline-shift="sub" font-size="8.64">K3</tspan><tspan >  from the good case</tspan></text><line x1="540" y1="168" x2="467" y2="258" stroke="#c2410c" stroke-width="1.4" opacity="0.65" stroke-linecap="round" marker-end="url(#arr-g)"/><rect x="655" y="112" width="180" height="54" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1" opacity="0.07" /><text xml:space="preserve" x="745" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan >K</tspan><tspan baseline-shift="sub" font-size="9.36">4</tspan><tspan > = E(√−p</tspan><tspan baseline-shift="sub" font-size="9.36">4</tspan><tspan >)</tspan></text><text xml:space="preserve" x="745" y="156" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400"><tspan >r</tspan><tspan baseline-shift="sub" font-size="8.64">K4</tspan><tspan >  from the good case</tspan></text><line x1="745" y1="168" x2="501" y2="258" stroke="#c2410c" stroke-width="1.4" opacity="0.65" stroke-linecap="round" marker-end="url(#arr-g)"/><text xml:space="preserve" x="860" y="144" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c2410c" text-anchor="middle" font-weight="400" opacity="1" >…</text><text xml:space="preserve" x="450" y="50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400"><tspan >p</tspan><tspan baseline-shift="sub" font-size="9">i</tspan><tspan > ≡ −1 mod M outside a finite bad set: √−p</tspan><tspan baseline-shift="sub" font-size="9">i</tspan><tspan > ∉ E, since inertia at p</tspan><tspan baseline-shift="sub" font-size="9">i</tspan><tspan > moves it</tspan></text><text xml:space="preserve" x="450" y="76" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400" opacity="1" >index-two patching of conjugation-invariant trace identities  ⇒  one ρ over E</text><text xml:space="preserve" x="450" y="352" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan >ι(charpoly ρ(σ</tspan><tspan baseline-shift="super" font-size="9.36">−1</tspan><tspan >)) = ∏</tspan><tspan baseline-shift="sub" font-size="9.36">α∈B_v</tspan><tspan >(X − q</tspan><tspan baseline-shift="super" font-size="9.36">(a−1)/2</tspan><tspan >α)   for all but finitely many places v</tspan></text></svg>
