<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250" role="img" aria-labelledby="t d"><title id="t">The chain of theta lifts (schematic)</title><desc id="d">Schematic: unitary groups U(X0) -&gt; U(X1) -&gt; ... -&gt; U(Xm) linked by theta lifts; each lift carries a denominator D_j; the archive&#x27;s RankVal puts m between sqrt(x delta1) and 2 sqrt(x delta1), delta1 = x^(-eps/8).</desc><defs><marker id="arr-ch" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="60" y="80" width="120" height="52" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2" opacity="0.1" /><text xml:space="preserve" x="120" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan >U(X</tspan><tspan baseline-shift="sub" font-size="10.8">0</tspan><tspan >)</tspan></text><rect x="225" y="80" width="120" height="52" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2" opacity="0.13" /><text xml:space="preserve" x="285" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan >U(X</tspan><tspan baseline-shift="sub" font-size="10.8">1</tspan><tspan >)</tspan></text><rect x="390" y="80" width="120" height="52" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2" opacity="0.16" /><text xml:space="preserve" x="450" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan >U(X</tspan><tspan baseline-shift="sub" font-size="10.8">2</tspan><tspan >)</tspan></text><rect x="640" y="80" width="120" height="52" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2" opacity="0.19" /><text xml:space="preserve" x="700" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan >U(X</tspan><tspan baseline-shift="sub" font-size="10.8">m−1</tspan><tspan >)</tspan></text><rect x="815" y="80" width="120" height="52" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2" opacity="0.22" /><text xml:space="preserve" x="875" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan >U(X</tspan><tspan baseline-shift="sub" font-size="10.8">m</tspan><tspan >)</tspan></text><line x1="182" y1="106" x2="221" y2="106" stroke="#7c3aed" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#arr-ch)"/><text xml:space="preserve" x="203.5" y="96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400"><tspan >θ, ×D</tspan><tspan baseline-shift="sub" font-size="9">0</tspan></text><line x1="347" y1="106" x2="386" y2="106" stroke="#7c3aed" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#arr-ch)"/><text xml:space="preserve" x="368.5" y="96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400"><tspan >θ, ×D</tspan><tspan baseline-shift="sub" font-size="9">1</tspan></text><line x1="762" y1="106" x2="811" y2="106" stroke="#7c3aed" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#arr-ch)"/><text xml:space="preserve" x="788.5" y="96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400"><tspan >θ, ×D</tspan><tspan baseline-shift="sub" font-size="9">m−1</tspan></text><text xml:space="preserve" x="575" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="400" opacity="1" >· · ·</text><text xml:space="preserve" x="60" y="40" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="600" opacity="1" >π ↦ π ⊞ μⱼ[t] at each step: each lift is meant to mimic one order of multiplicity</text><text xml:space="preserve" x="60" y="176" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400"><tspan >√(xδ</tspan><tspan baseline-shift="sub" font-size="9.36">1</tspan><tspan >) ≤ m ≤ 2√(xδ</tspan><tspan baseline-shift="sub" font-size="9.36">1</tspan><tspan >),   δ</tspan><tspan baseline-shift="sub" font-size="9.36">1</tspan><tspan > = x</tspan><tspan baseline-shift="super" font-size="9.36">−ε/8</tspan><tspan >   ⇒   m ≈ x</tspan><tspan baseline-shift="super" font-size="9.36">1/2 − ε/16</tspan><tspan fill="#64748b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">      GlobalTheory.EX.RankVal</tspan></text><text xml:space="preserve" x="60" y="206" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="400"><tspan >(∏ D</tspan><tspan baseline-shift="sub" font-size="9.36">j</tspan><tspan >) · (T</tspan><tspan baseline-shift="sub" font-size="9.36">m−1</tspan><tspan > ⋯ T</tspan><tspan baseline-shift="sub" font-size="9.36">0</tspan><tspan > f)(v) ∈ S  when every D</tspan><tspan baseline-shift="sub" font-size="9.36">j</tspan><tspan >w</tspan><tspan baseline-shift="sub" font-size="9.36">j</tspan><tspan >, every kernel entry and f are S-integral</tspan><tspan fill="#64748b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">      Formalism.ThetaLiftIndependence.ChainInt</tspan></text></svg>
