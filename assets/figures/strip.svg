="202.32" r="4.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" opacity="1" /><circle cx="375.71" cy="160.28" r="4.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" opacity="1" /><circle cx="375.71" cy="130.16" r="4.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" opacity="1" /><circle cx="375.71" cy="108.39" r="4.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" opacity="1" /><circle cx="375.71" cy="66.11" r="4.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" opacity="1" /><circle cx="375.71" cy="50.12" r="4.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" opacity="1" /><circle cx="455.71" cy="257.77" r="6.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" opacity="1" /><circle cx="295.71" cy="257.77" r="6.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" opacity="1" stroke-dasharray="3 2"/><path d="M304.71,266.77 Q375.71,309.77 446.71,266.77" fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#arr-strip)"/><text xml:space="preserve" x="375.71" y="329.77" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan >reflection: L(s, χ) = 0  ⇒  L(1 − s, χ</tspan><tspan baseline-shift="super" font-size="8.64">−1</tspan><tspan >) = 0</tspan></text><text xml:space="preserve" x="467.71" y="262.77" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400" opacity="1" font-style="italic" >ρ ?</text><text xml:space="preserve" x="281.71" y="262.77" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0f172a" text-anchor="end" font-weight="400" opacity="1" font-style="italic" >1 − ρ</text><line x1="272.71" y1="248.77" x2="280.71" y2="248.77" stroke="#0f172a" stroke-width="1.2